[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nettwin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.165.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[project.scripts]
nettwin = "nettwin.__main__:main"

[tool.setuptools.package-data]
nettwin = ["static/*"]
